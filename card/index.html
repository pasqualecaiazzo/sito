<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pasquale Caiazzo</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pasquale Caiazzo">
<meta name="theme-color" content="#0e0e0e">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #000000;
    --surface: #080808;
    --border:  #1f1f1f;
    --accent:  #4a9eff;
    --text:    #f0ede8;
    --muted:   #666;
    --radius:  16px;
  }

  html, body {
    min-height: 100%;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ── header ── */
  .card-header {
    background: var(--accent);
    padding: 20px 24px 18px;
    text-align: center;
  }
  .card-name {
    font-family: 'IBM Plex Serif', serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: #0e0e0e;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .card-title {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.75);
    margin-top: 5px;
  }

  /* ── QR ── */
  .card-qr {
    padding: 28px 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .qr-wrapper {
    background: #fff;
    padding: 12px;
    border-radius: 10px;
    line-height: 0;
  }
  .qr-wrapper img {
    display: block;
    width: 180px;
    height: 180px;
  }
  .qr-caption {
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  /* ── action buttons ── */
  .btn-contact, .btn-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 16px 24px 0;
    padding: 13px 0;
    border-radius: 10px;
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: opacity 0.15s;
  }
  .btn-contact {
    background: var(--accent);
    color: #0e0e0e;
  }
  .btn-whatsapp {
    background: #25D366;
    color: #ffffff;
    margin-bottom: 24px;
  }
  .btn-contact:active, .btn-whatsapp:active { opacity: 0.8; }
  .btn-contact svg, .btn-whatsapp svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 24px;
  }

  /* ── contact rows ── */
  .card-contacts {
    padding: 20px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text);
  }
  .contact-row:active { opacity: 0.7; }
  .contact-icon {
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--accent);
  }
  .contact-icon svg { width: 15px; height: 15px; }
  .contact-info { display: flex; flex-direction: column; gap: 1px; }
  .contact-label {
    font-size: 0.56rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .contact-value {
    font-size: 0.76rem;
    color: var(--text);
    line-height: 1.3;
  }

  /* ── footer ── */
  .card-footer {
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-footer span {
    font-size: 0.58rem;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  /* ── mobile optimizations (fullscreen, fixed, no scroll) ── */
  @media (max-width: 480px) {
    html, body {
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    .card {
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: none;
      border: none;
      border-radius: 0;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 22px 24px 18px;
      flex-shrink: 0;
    }
    .card-name {
      font-size: 1.55rem;
    }
    .card-title {
      font-size: 0.72rem;
    }

    .card-qr {
      padding: 20px 24px 0;
      gap: 12px;
      flex-shrink: 0;
    }
    .qr-wrapper {
      padding: 10px;
      border-radius: 10px;
    }
    .qr-wrapper img {
      width: 175px;
      height: 175px;
    }
    .qr-caption {
      font-size: 0.68rem;
    }

    .btn-contact, .btn-whatsapp {
      margin: 10px 24px 0;
      padding: 14px 0;
      font-size: 0.88rem;
      flex-shrink: 0;
    }
    .btn-whatsapp {
      margin-bottom: 16px;
    }

    .divider {
      margin: 0 24px;
      flex-shrink: 0;
    }

    .card-contacts {
      padding: 18px 24px;
      gap: 16px;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      overflow: hidden;
    }
    
    .contact-row {
      gap: 14px;
    }
    .contact-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
    }
    .contact-icon svg {
      width: 17px;
      height: 17px;
    }
    .contact-label {
      font-size: 0.66rem;
    }
    .contact-value {
      font-size: 0.9rem;
    }

    .card-footer {
      padding: 14px 24px;
      flex-shrink: 0;
    }
    .card-footer span {
      font-size: 0.68rem;
    }
  }

  /* ── safety scale for very short screens (e.g. iPhone SE) ── */
  @media (max-width: 480px) and (max-height: 667px) {
    .card-header {
      padding: 14px 20px 12px;
      flex-shrink: 0;
    }
    .card-name {
      font-size: 1.35rem;
    }
    .card-title {
      font-size: 0.65rem;
    }
    .card-qr {
      padding: 10px 20px 0;
      gap: 8px;
      flex-shrink: 0;
    }
    .qr-wrapper img {
      width: 130px;
      height: 130px;
    }
    .qr-caption {
      font-size: 0.6rem;
    }
    .btn-contact, .btn-whatsapp {
      margin: 8px 20px 0;
      padding: 11px 0;
      font-size: 0.82rem;
      flex-shrink: 0;
    }
    .btn-whatsapp {
      margin-bottom: 10px;
    }
    .card-contacts {
      padding: 10px 20px;
      gap: 10px;
    }
    .contact-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }
    .contact-icon svg {
      width: 15px;
      height: 15px;
    }
    .contact-label {
      font-size: 0.6rem;
    }
    .contact-value {
      font-size: 0.82rem;
    }
    .card-footer span {
      font-size: 0.6rem;
    }
  }
</style>
</head>
<body>
