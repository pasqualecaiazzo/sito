<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pasquale Caiazzo</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pasquale Caiazzo">
<meta name="theme-color" content="#0e0e0e">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0e0e0e;
    --surface: #161616;
    --border:  #2a2a2a;
    --accent:  #e8c547;
    --text:    #f0ede8;
    --muted:   #666;
    --radius:  16px;
  }

  html, body {
    min-height: 100%;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ── header ── */
  .card-header {
    background: var(--accent);
    padding: 20px 24px 18px;
  }
  .card-name {
    font-family: 'IBM Plex Serif', serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: #0e0e0e;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .card-title {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.45);
    margin-top: 5px;
  }

  /* ── QR ── */
  .card-qr {
    padding: 28px 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .qr-wrapper {
    background: #fff;
    padding: 12px;
    border-radius: 10px;
    line-height: 0;
  }
  .qr-wrapper img {
    display: block;
    width: 180px;
    height: 180px;
  }
  .qr-caption {
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  /* ── add contact button ── */
  .btn-contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 16px 24px 24px;
    padding: 13px 0;
    background: var(--accent);
    color: #0e0e0e;
    border-radius: 10px;
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: opacity 0.15s;
  }
  .btn-contact:active { opacity: 0.8; }
  .btn-contact svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 24px;
  }

  /* ── contact rows ── */
  .card-contacts {
    padding: 20px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text);
  }
  .contact-row:active { opacity: 0.7; }
  .contact-icon {
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--accent);
  }
  .contact-icon svg { width: 15px; height: 15px; }
  .contact-info { display: flex; flex-direction: column; gap: 1px; }
  .contact-label {
    font-size: 0.56rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .contact-value {
    font-size: 0.76rem;
    color: var(--text);
    line-height: 1.3;
  }

  /* ── footer ── */
  .card-footer {
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-footer span {
    font-size: 0.58rem;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  /* ── mobile optimizations (fullscreen, fixed, no scroll) ── */
  @media (max-width: 480px) {
    html, body {
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    .card {
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: none;
      border: none;
      border-radius: 0;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 16px 20px 14px;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 0.68rem;
    }

    .card-qr {
      padding: 16px 20px 0;
      gap: 10px;
      flex-shrink: 0;
    }
    .qr-wrapper {
      padding: 8px;
      border-radius: 8px;
    }
    .qr-wrapper img {
      width: 140px;
      height: 140px;
    }
    .qr-caption {
      font-size: 0.62rem;
    }

    .btn-contact {
      margin: 12px 20px;
      padding: 12px 0;
      font-size: 0.82rem;
      flex-shrink: 0;
    }

    .divider {
      margin: 0 20px;
      flex-shrink: 0;
    }

    .card-contacts {
      padding: 16px 20px;
      gap: 12px;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      overflow: hidden;
    }
    
    .contact-row {
      gap: 10px;
    }
    .contact-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .contact-icon svg {
      width: 13px;
      height: 13px;
    }
    .contact-label {
      font-size: 0.62rem;
    }
    .contact-value {
      font-size: 0.82rem;
    }

    .card-footer {
      padding: 10px 20px;
      flex-shrink: 0;
    }
    .card-footer span {
      font-size: 0.62rem;
    }
  }

  /* ── safety scale for very short screens (e.g. iPhone SE) ── */
  @media (max-width: 480px) and (max-height: 667px) {
    .card-header {
      padding: 12px 20px 10px;
    }
    .card-title {
      font-size: 0.64rem;
    }
    .card-qr {
      padding: 10px 20px 0;
      gap: 8px;
    }
    .qr-wrapper img {
      width: 110px;
      height: 110px;
    }
    .qr-caption {
      font-size: 0.58rem;
    }
    .btn-contact {
      margin: 8px 20px;
      padding: 9px 0;
      font-size: 0.78rem;
    }
    .card-contacts {
      padding: 10px 20px;
      gap: 8px;
    }
    .contact-label {
      font-size: 0.58rem;
    }
    .contact-value {
      font-size: 0.76rem;
    }
    .card-footer span {
      font-size: 0.58rem;
    }
  }
</style>
</head>
<body>

    <a class="contact-row" href="mailto:pasqualecaiazzo.adv@gmail.com">
      <div class="contact-icon">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>

  </div>

  <!-- footer -->
  <div class="card-footer">
    <span>Torino, IT</span>
    <span>P.IVA IT01712990058</span>
  </div>

</div>

<script>
// QR punta all'URL del vcf — QR piccolo e facile da scansionare
const vcfUrl = 'https://pasqualecaiazzo.com/card/pasquale-caiazzo.vcf';
document.getElementById('qr').src =
  'https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=' +
  encodeURIComponent(vcfUrl);
</script>

</body>
</html>
